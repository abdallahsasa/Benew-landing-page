<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3B1270"/>
      <stop offset="55%" stop-color="#220845"/>
      <stop offset="100%" stop-color="#130328"/>
    </radialGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E083B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#DDD2F0"/>
    </linearGradient>
    <linearGradient id="pearlShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE4C8"/>
      <stop offset="100%" stop-color="#D4C29A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="gum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#090114" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bgGlow)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="320" cy="195" r="165" fill="url(#goldAura)"/>

      <g filter="url(#softShadow)">
        <!-- 1. Zirconia Crown on top -->
        <path d="M268,95 C268,72 294,66 312,75 C317,78 323,78 328,75 C346,66 372,72 372,95 C372,122 362,145 352,152 L288,152 C278,145 268,122 268,95 Z" fill="url(#pearl)"/>
        <!-- 2. Gold Abutment connector -->
        <polygon points="298,162 342,162 334,194 306,194" fill="url(#gold)"/>
        <!-- Gumline horizon -->
        <path d="M190,206 Q320,192 450,206" fill="none" stroke="url(#gum)" stroke-width="10" stroke-linecap="round"/>
        <!-- 3. Titanium threaded implant fixture -->
        <polygon points="296,210 344,210 332,302 308,302" fill="url(#titanium)"/>
        <g stroke="#1E083B" stroke-width="2.5" stroke-linecap="round">
          <line x1="294" y1="224" x2="346" y2="230"/>
          <line x1="297" y1="240" x2="343" y2="246"/>
          <line x1="300" y1="256" x2="340" y2="262"/>
          <line x1="303" y1="272" x2="337" y2="278"/>
          <line x1="306" y1="288" x2="334" y2="294"/>
        </g>
      </g>
      <!-- Callout lines -->
      <line x1="382" y1="110" x2="430" y2="110" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="438" y="114" fill="#E9D5FF" font-family="Inter, sans-serif" font-size="11" font-weight="600">Crown</text>
      <line x1="352" y1="178" x2="430" y2="178" stroke="#FBBF24" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="438" y="182" fill="#FDE68A" font-family="Inter, sans-serif" font-size="11" font-weight="600">Abutment</text>
      <line x1="352" y1="256" x2="430" y2="256" stroke="#94A3B8" stroke-opacity="0.7" stroke-width="1.5"/>
      <text x="438" y="260" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="11" font-weight="600">Ti-Implant</text>
      <rect x="218" y="328" width="204" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.4"/>
      <text x="320" y="346" text-anchor="middle" fill="#FDE68A" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TITANIUM &amp; ZIRCONIA</text>
    </svg>
