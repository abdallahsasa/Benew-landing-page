<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3B1270"/>
      <stop offset="55%" stop-color="#220845"/>
      <stop offset="100%" stop-color="#130328"/>
    </radialGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E083B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F5F0FF"/>
      <stop offset="100%" stop-color="#DDD2F0"/>
    </linearGradient>
    <linearGradient id="pearlShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE4C8"/>
      <stop offset="100%" stop-color="#D4C29A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="gum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="cyanGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#090114" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bgGlow)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <circle cx="320" cy="195" r="165" fill="url(#goldAura)"/>

      <g filter="url(#softShadow)">
        <!-- Prepared natural tooth base & gum -->
        <path d="M210,275 Q320,255 430,275" fill="none" stroke="url(#gum)" stroke-width="14" stroke-linecap="round"/>
        <path d="M286,272 L296,205 C298,195 342,195 344,205 L354,272 Z" fill="url(#pearlShade)"/>
        <!-- Floating translucent porcelain crown cap above -->
        <path d="M258,108 C258,80 288,72 310,83 C316,86 324,86 330,83 C352,72 382,80 382,108 C382,138 370,162 362,172 L278,172 C270,162 258,138 258,108 Z" fill="url(#pearl)" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>
      <!-- Downward placement arrows -->
      <path d="M320,178 L320,194" stroke="#FBBF24" stroke-width="3" stroke-linecap="round"/>
      <polygon points="320,200 313,190 327,190" fill="#FBBF24"/>
      <rect x="220" y="328" width="200" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.4"/>
      <text x="320" y="346" text-anchor="middle" fill="#FDE68A" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1">360° PORCELAIN CAP</text>
    </svg>
